[package]
name = "m3-inference"
description = "M3 推理基座 spike：ort + DirectML 接入验证与耗时基线（不随发布物分发）"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
# ONNX Runtime 绑定（ADR-01/05）：download-binaries 自动取官方预编译库，
# copy-dylibs 把它拷到 target 旁，避免「随附 ONNX Runtime 动态库」这个风险项手工作业。
ort = { version = "2.0.0-rc.13", features = ["directml"] }

# M3 选型评估用：OCR 候选（评估其推理后端是否与 ort 2.0.0-rc.13 共用同一份 ONNX Runtime）
rapidocr-core = { version = "0.2.2", default-features = false }
ultralytics-inference = { version = "0.0.44", default-features = false }

# examples 用（ocr_probe 等）
image = { workspace = true }

[lints]
workspace = true
