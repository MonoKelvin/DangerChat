[workspace]
resolver = "2"
members = [
    "crates/dc-core",
    "crates/dc-sys",
    "crates/dc-pipeline",
    "spikes/m3-inference",
    "tools/redline_scan",
    "apps/uitag/src-tauri",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.98"
license = "Apache-2.0"
publish = false

[workspace.dependencies]
# 序列化 / 配置
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
thiserror = "2"

# 日志
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }

# 并发（ADR-09：std::thread + crossbeam，不引入 tokio）
crossbeam-channel = "0.5"
# 判定槽位无锁交换（§2.2 verdict_slot）
arc-swap = "1"

# 图像（截图缓冲 / 图片日志）
image = { version = "0.25", default-features = false, features = ["png"] }

# 内部 crate
dc-core = { path = "crates/dc-core" }
dc-sys = { path = "crates/dc-sys" }
dc-pipeline = { path = "crates/dc-pipeline" }

# 测试
tempfile = "3"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "warn"
unused_must_use = "warn"

[workspace.lints.clippy]
all = "warn"
todo = "warn"

[profile.release]
# 体积是发布指标之一（NFR-11：安装包 ≤ 80MB）
opt-level = "z"
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true

# tauri dev（debug profile）下 imageproc 的 NCC 慢 10~50×，
# 预标注传播会卡死——依赖包按 release 优化编译（自编译代码保持快速增量）
[profile.dev.package."*"]
opt-level = 3
